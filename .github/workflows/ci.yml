name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local development version, so CI cannot pass on a
          # runtime nobody actually runs.
          node-version: 24
          cache: npm

      # Pinned to the version the lock file was generated with. Different npm
      # versions resolve the optional-dependency graph differently, which makes
      # `npm ci` reject a lock that is perfectly valid for development.
      - run: npm install --global npm@11.6.2

      - run: npm --version

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Unit tests only. Every model call is mocked here by design: live calls
      # would make CI flaky, slow and billable, and a test nobody trusts is
      # worse than no test. Integration tests need a Supabase project and are
      # opt-in; the RAG eval runs against a live model, by hand.
      - run: npm test

      # The build only imports modules while collecting page data — it never
      # calls Supabase or OpenAI. But `lib/env*.ts` validates these variables
      # eagerly at import, which is a feature everywhere real: a Vercel deploy
      # with a missing secret fails at build instead of 500ing at runtime.
      # Placeholders keep that guarantee out of CI's way without weakening it,
      # and they are obviously fake so a leak into any real config is loud.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: https://ci-placeholder.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local development version, so CI cannot pass on a
          # runtime nobody actually runs.
          node-version: 24
          cache: npm

      # Optional dependencies are skipped deliberately. They are the WASM
      # fallbacks for native tooling (Tailwind's oxide, sharp), which a Linux
      # x64 runner never needs — and npm on Windows does not record their
      # transitive graph in the lock file, so a plain `npm ci` fails here on a
      # lock that is perfectly valid for development.
      - run: npm ci --omit=optional

      - run: npm run lint

      - run: npm run typecheck

      # Unit tests only. Every model call is mocked here by design: live calls
      # would make CI flaky, slow and billable, and a test nobody trusts is
      # worse than no test. Integration tests need a Supabase project and are
      # opt-in; the RAG eval runs against a live model, by hand.
      - run: npm test

      - run: npm run build
